[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everrun"
version = "0.1.0"
description = "A standalone local-first coding harness with persistent model-driven tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyJWT[crypto]>=2.10,<3"]

[project.scripts]
everrun = "everrun_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
