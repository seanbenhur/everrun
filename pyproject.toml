[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everrun"
version = "0.1.0"
description = "A local-first harness for persistent coding tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
everrun = "everrun_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
